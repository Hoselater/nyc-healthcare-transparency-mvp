# Collect NYC DOT traffic for the East Side of Manhattan, on request.
#
# This exists because the feeds cannot be reached from every environment, and
# because a single snapshot cannot measure congestion: free-flow baselines need
# readings spread across hours. GitHub's runners have ordinary internet access,
# so they can do both.
#
# Results are published to the `traffic-data` branch, not this one. Read the
# latest one at traffic_data/latest_report.md on that branch.
#
# MANUAL ONLY. There is no schedule. Nothing here starts on its own and nothing
# collects unless someone asks it to from the Actions tab. run_for_hours=0, the
# default, takes one snapshot and stops; a larger value keeps collecting for
# that many hours, and can be cancelled at any time from the run's page.

on:
  workflow_dispatch:
    inputs:
      run_for_hours:
        description: "Keep collecting for this many hours (0 = one snapshot). Max 5.5."
        type: string
        default: "0"
      images:
        description: "Also capture a still from every East Side camera"
        type: boolean
        default: false
      history_days:
        description: "Days of readings to retain"
        type: string
        default: "3"

permissions:
  contents: write

# Overlapping runs would race to push the same branch. Queue instead, and never
# cancel a run that may already have committed.
concurrency:
  group: nyc-traffic-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Long enough for a full continuous run. A hosted job is killed at six
    # hours, so this leaves room to finish the last collection and push it.
    timeout-minutes: 350

    steps:
      - name: Check out the collector
        uses: actions/checkout@v4
        with:
          # Full history: the publish step adds a linked worktree for the data
          # branch, which a shallow clone makes awkward.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # The scraper deliberately depends on nothing but requests, so this does
        # not pull in the healthcare pipeline's database and dataframe stack.
        run: pip install --quiet --disable-pip-version-check requests

      - name: Run the tests
        # Cheap, offline, and it stops a broken collector from publishing a
        # report full of plausible-looking nonsense.
        run: python -m unittest discover -s tests -t . --quiet

      - name: Collect a snapshot, publish it, and alert if needed
        env:
          DATA_BRANCH: traffic-data
          HISTORY_DAYS: ${{ inputs.history_days || '3' }}
          IMAGES: ${{ inputs.images || false }}
          KEEP_RUNS: "72"
          RUN_FOR_HOURS: ${{ inputs.run_for_hours || '0' }}
          INTERVAL_MINUTES: "20"

          # Phone alerts. Set whichever one you use as a repository secret;
          # alerting stays off entirely while these are empty. A missing secret
          # is an empty string, not an error.
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # What is worth interrupting someone for. "severe" means under 40% of
          # free flow. Set NOTIFY_LEVEL to "heavy" for a lower bar.
          NOTIFY_LEVEL: ${{ vars.NOTIFY_LEVEL }}
          NOTIFY_CORRIDORS: ${{ vars.NOTIFY_CORRIDORS }}

          # Lets the alert carry a tappable link to the published report.
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/collect_continuously.sh
